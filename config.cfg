
[Training]
    epochs = 1_000
    batch_size = 128
    log_every = 50
    sample_every = 100
    ckpt_every = 1_000
    lr = 1e-5
    weight_decay = 0
    wandb = False

    results-dir = results
    seed = 42
    num_workers = 4
    entity = 
    project = med_project

    emb_freeze = False
    emb_ckpt = None


[Trained Instances]
    [[base_model]]
    type = MarginalModel
    sampler = SSESampler
    label = Baseline model
        [[[model_args]]]
        hidden_dims = 100, 256
        [[[sampler_args]]]

    [[ar_model]]
    type = AutoRegModel
    sampler = AutoRegSampler
        [[[model_args]]]
        [[[sampler_args]]]

[Data]
    [[Paths & Directories]]
    train_path = data/Med_ADNe_pa_filtered.csv #if folds are present (dataset & checkpoint) and test is None, train or evaluate on every folds
    test_path = None #data/test_species.csv
    metadata_path = data/meta_mod.csv

    [[Folds]]
    kfold_path = data/meta_mod.csv
    index_fold = spatial_fold

    [[Dataset]]
    dataset_class = TabularDataset

    [[Dataset Args]]
    tokenize_method= stocha
    index_column= spygen_code
    var_cols = depth, mpa_fully, temperature, volume_sampled


[Evaluation]
nb_sample = 50
batch_max = None
compute_mmd = False
colors = 07586b, ff751f, 42a5f5


[Evaluated Instances]
    [[base_model]]
    ckpt_folder = 
    ckpt_step = 10_000
    sampler = MarginalSampler
    label = Baseline model
        [[[sampler_args]]]
    
    [[glm_model]]
    sampler = CSVSampler
    label = GLM model
        [[[sampler_args]]]
        file_path = data/probability_draws_50.csv
        id_name = spygen_code
    [[ar_model]]
    ckpt_folder = 
    ckpt_step = 10_000
    sampler = AutoRegSampler
    label = AR model
        [[[sampler_args]]]
        selection = stocha
        T = 1



